services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: sporealert
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - sporealert_postgres:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sporealert"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sporealert_postgres:
